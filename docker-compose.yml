services:
  wuzmind-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/douglassilsouza/wuzmind-service:latest
    container_name: wuzmind-service
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-wuzmind}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      WUZMIND_API_KEY: ${WUZMIND_API_KEY}

      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-GEMINI,OPENAI,STATIC}
      AI_TOTAL_TIMEOUT_MS: ${AI_TOTAL_TIMEOUT_MS:-12000}
      AI_MAX_RETRIES_PER_PROVIDER: ${AI_MAX_RETRIES_PER_PROVIDER:-0}
      AI_MIN_CONFIDENCE: ${AI_MIN_CONFIDENCE:-0.65}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_MODEL_CANDIDATES: ${GEMINI_MODEL_CANDIDATES:-gemini-2.5-flash,gemini-2.5-flash-lite,gemini-1.5-flash,gemini-2.0-flash}
      GEMINI_MODELS_CACHE_TTL_MS: ${GEMINI_MODELS_CACHE_TTL_MS:-3600000}
      GEMINI_DISCOVERY_TIMEOUT_MS: ${GEMINI_DISCOVERY_TIMEOUT_MS:-5000}
      GEMINI_REQUEST_TIMEOUT_MS: ${GEMINI_REQUEST_TIMEOUT_MS:-6000}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_REQUEST_TIMEOUT_MS: ${OPENAI_REQUEST_TIMEOUT_MS:-5000}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}

      LOG_LEVEL: ${LOG_LEVEL:-info}

    networks:
      - ContasNet

    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.docker.network=ContasNet
        - traefik.http.routers.wuzmind.rule=Host(`wuzmind.dsilvamoda.cloud`)
        - traefik.http.routers.wuzmind.entrypoints=websecure
        - traefik.http.routers.wuzmind.tls=true
        - traefik.http.routers.wuzmind.tls.certresolver=letsencryptresolver
        - traefik.http.services.wuzmind.loadbalancer.server.port=3000

networks:
  ContasNet:
    external: true
    name: ContasNet
